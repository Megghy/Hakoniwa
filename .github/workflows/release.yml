name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# 不跑 pull_request：公开仓库的 fork PR 不能上这台 self-hosted
permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, hakoniwa]
    env:
      TerrariaDir: D:\HakoniwaBuild\Terraria
      NUGET_PACKAGES: D:\HakoniwaBuild\nuget
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: version
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          Add-Content $env:GITHUB_ENV "HAKONIWA_VERSION=$($env:GITHUB_RUN_NUMBER)-$sha"

      - name: build
        shell: pwsh
        run: |
          dotnet test Hakoniwa.slnx -c Release --nologo -p:TerrariaDir=$env:TerrariaDir -p:HakoniwaVersion=$env:HAKONIWA_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:TerrariaDir\Hakoniwa.exe")) { throw "Hakoniwa.exe missing" }
          Set-Content -Path "$env:TerrariaDir\version.txt" -Value $env:HAKONIWA_VERSION -NoNewline

      - name: pack
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "Hakoniwa.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Push-Location $env:TerrariaDir
          $items = @("Hakoniwa.exe", "Hakoniwa", "version.txt")
          if (Test-Path "Hakoniwa.exe.config") { $items += "Hakoniwa.exe.config" }
          Remove-Item -Force -ErrorAction SilentlyContinue @(
            "$env:TerrariaDir\Hakoniwa\Hakoniwa.exe",
            "$env:TerrariaDir\Hakoniwa\Hakoniwa.exe.config",
            "$env:TerrariaDir\Hakoniwa\Hakoniwa.pdb")
          tar.exe -a -c -f $zip --exclude=*.pdb --exclude=Hakoniwa/Hakoniwa.exe --exclude=Hakoniwa/Hakoniwa.exe.config @items
          Pop-Location

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.HAKONIWA_VERSION }}
          name: ${{ env.HAKONIWA_VERSION }}
          body: ${{ env.HAKONIWA_VERSION }}
          files: Hakoniwa.zip
          make_latest: true
